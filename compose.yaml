name: nexaisp-billing
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaisp}
      POSTGRES_USER: ${POSTGRES_USER:-nexaisp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./setup.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaisp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexaisp}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - work_order_photos:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  telegram_worker:
    image: nexaisp-billing-backend:latest
    command: ["python", "-m", "app.telegram_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexaisp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexaisp}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - work_order_photos:/app/uploads
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-3100}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, edge]

  # HTTPS publik di port 443 (aktif bila BILLING_DOMAIN diisi di .env). IP tetap agar nginx frontend
  # hanya mempercayai X-Forwarded-For dari Caddy (pembatas login per IP pengunjung asli).
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:443:443"
    environment:
      BILLING_DOMAIN: ${BILLING_DOMAIN:?Isi BILLING_DOMAIN di .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks:
      edge:
        ipv4_address: 172.30.250.6

volumes:
  postgres_data:
  work_order_photos:
  caddy_data:
  caddy_config:
networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.250.0/29
